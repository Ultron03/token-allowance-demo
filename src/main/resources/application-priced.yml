# Dollar budgets with Gemini 3.5 Flash-Lite's published prices; use with the gemini profile.
spring:
  ai:
    openai:
      chat:
        options:
          model: gemini-3.5-flash-lite
          max-tokens: 200
token-allowance:
  estimate:
    output-tokens: 60
  pricing:
    models:
      - { name: gemini-3.5-flash-lite, input-per-mtok: "0.30", output-per-mtok: "2.50", cached-input-per-mtok: "0.03" }
  limits:
    - { scope: user, window: daily, max-cost: "0.00025" }
    - { scope: tenant, window: daily, max-cost: "0.01" }
  plans:
    pro:
      - { scope: user, window: daily, max-cost: "0.05" }
