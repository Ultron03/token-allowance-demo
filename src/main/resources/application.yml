spring:
  config:
    import: optional:file:.env[.properties]
  ai:
    model:
      chat: ollama
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      chat:
        model: llama3.2
token-allowance:
  limits:
    - { scope: user, window: daily, max-tokens: 2000 }
    - { scope: tenant, window: daily, max-tokens: 5000 }
  plans:
    pro:
      - { scope: user, window: daily, max-tokens: 20000 }
      - { scope: user, window: minute, max-tokens: 5000 }
  per-request:
    max-model-calls: 2
  estimate:
    output-tokens: 300
management:
  endpoints:
    web:
      exposure:
        include: health,tokenallowance,prometheus
