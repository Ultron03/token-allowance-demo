# Redis for shared budgets, Prometheus and Grafana for the token.allowance.* meters.
# The app runs on the host:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=redis
# No local Ollama? Start it here too:  docker compose --profile ollama up -d
services:
  redis:
    image: redis:8.0.3
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Counters such as denials are created at their first event; this counts that first event too.
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/token-allowance.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  ollama:
    image: ollama/ollama:0.11.4
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull llama3.2 && wait"]

volumes:
  ollama:
